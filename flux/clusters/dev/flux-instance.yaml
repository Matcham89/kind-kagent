---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 1h
    fluxcd.controlplane.io/reconcileTimeout: 5m
    fluxcd.controlplane.io/reconcileArtifactEvery: 10m
spec:
  distribution:
    # Pinned, not "2.x". flux-operator patches the Flux CRDs it installs, and
    # one patch adds an enum value at
    #   /spec/versions/1/.../eventSources/items/properties/kind/enum/-
    # on the notification-controller Receiver CRD. Newer Flux serves only one
    # Receiver version, so index 1 does not exist and the FluxInstance goes
    # Stalled=BuildFailed having installed NO Flux CRDs at all — nothing
    # downstream reconciles. Confirmed failing on 2.9.x under both operator
    # 0.38.1 and 0.52.0, so bumping the operator alone does not help.
    #
    # 2.8.x is the newest that builds, and is also the floor for this repo:
    # the kagent HelmRelease uses spec.install.strategy / spec.upgrade.strategy,
    # which helm-controller only accepts from v1.5.x (Flux 2.8). On 2.6.x it
    # fails the dry-run with "field not declared in schema".
    # Verify after bumping — wait for a terminal condition, do not sample early:
    #   kubectl -n flux-system get fluxinstance flux \
    #     -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}'
    # NOTE: flux/clusters/dev/flux-system/gotk-components.yaml is still v2.9.5
    # and inconsistent with this pin. The operator owns the components so it is
    # inert, but regenerate it at 2.8.x when convenient.
    version: 2.8.x
    registry: ghcr.io/fluxcd
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
    domain: cluster.local
    size: small
  sync:
    kind: GitRepository
    url: https://github.com/Matcham89/kind-kagent.git
    ref: refs/heads/main
    path: flux/clusters/dev
    interval: 1m
  kustomize:
    patches:
      # Kubernetes 1.34+ rejects '+' in label values, and helm-controller
      # appends the OCI digest to the chart version — producing the label
      # "0.10.0-rc3+e9f54ef164de", which fails admission on every object the
      # kagent chart applies:
      #   ServiceAccount "kagent-controller" is invalid: metadata.labels:
      #   Invalid value: "0.10.0-rc3+e9f54ef164de"
      # This feature gate stops helm-controller adding the digest suffix.
      # See https://github.com/fluxcd/flux2/issues/4910
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=DisableChartDigestTracking=true
  wait: true
  migrateResources: true