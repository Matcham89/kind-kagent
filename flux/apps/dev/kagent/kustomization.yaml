---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent
# Privileged PSS. The kagent-default WorkerPool's ateom-gvisor worker pods run
# in THIS namespace, and while they are not `privileged: true` they do request
# capabilities.add: [NET_ADMIN, SYS_ADMIN, SYS_CHROOT, SYS_PTRACE, ...] plus
# appArmorProfile: Unconfined. SYS_ADMIN alone is rejected under both
# restricted and baseline, so an AgentHarness never gets a worker to run on.
components:
  - ../../../infra/namespace-privileged

resources:
  - ./crds/ks.yaml
  - ./operator/ks.yaml
  - ./secrets/ks.yaml
  - ./providers/ks.yaml
  - ./mcps/ks.yaml
  # Declarative k8s-* agents are disabled: this cluster runs the hermes
  # AgentHarness only. To re-enable, rename
  # ./agents/ks.yaml.disabled back to ./agents/ks.yaml and uncomment below.
  # The .disabled suffix matters: where a directory has no kustomization.yaml,
  # Flux generates one from the *.yaml it finds, so a stray ks.yaml could still
  # be picked up even though it is not listed here.
  # - ./agents/ks.yaml
  - ./agent-harnesses/ks.yaml