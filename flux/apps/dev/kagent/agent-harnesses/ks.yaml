---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kagent-agent-harnesses
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kagent-operator
    - name: kagent-secrets
    # AgentHarness provisions an ActorTemplate on substrate, so ateapi and the
    # kagent-default WorkerPool must exist first.
    - name: substrate-operator
      namespace: ate-system
  interval: 1h
  path: ./flux/apps/base/kagent/agent-harnesses
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kagent
  timeout: 5m
  prune: true
  wait: true