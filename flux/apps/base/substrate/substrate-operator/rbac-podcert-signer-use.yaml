---
# The substrate chart grants podcertificate-controller-system's default
# ServiceAccount `sign`/`attest` on the two podcert.ate.dev signers, but never
# grants any workload `use` on them.
#
# Kubernetes requires the identity that submits a Pod (or a workload template
# embedding one) to hold `use` on the exact signer name before it will honor a
# podCertificate / clusterTrustBundle projection's signerName. Without it the
# source is silently stripped to `sources: [{}]` at admission — no error, no
# event — and postgres / ate-controller / ate-api-server / atelet /
# atenet-router / atenet-egress come up with empty cert projections.
#
# `kubectl auth can-i` mis-parses signer names containing '/' and always reports
# "no"; use a raw SubjectAccessReview to check:
#   kubectl create --raw /apis/authorization.k8s.io/v1/subjectaccessreviews -f - <<'SAR'
#   {"apiVersion":"authorization.k8s.io/v1","kind":"SubjectAccessReview","spec":{
#     "user":"system:serviceaccount:ate-system:default",
#     "resourceAttributes":{"group":"certificates.k8s.io","resource":"signers",
#       "name":"servicedns.podcert.ate.dev/identity","verb":"use"}}}
#   SAR
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podcert-ate-dev-signer-use
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames:
      - servicedns.podcert.ate.dev/identity
      - podidentity.podcert.ate.dev/identity
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podcert-ate-dev-signer-use
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podcert-ate-dev-signer-use
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ate-system
  - kind: ServiceAccount
    name: ate-api-server
    namespace: ate-system
  - kind: ServiceAccount
    name: ate-controller
    namespace: ate-system
  - kind: ServiceAccount
    name: atenet-egress
    namespace: ate-system
  - kind: ServiceAccount
    name: atenet-router
    namespace: ate-system
  - kind: ServiceAccount
    name: atelet
    namespace: ate-system
