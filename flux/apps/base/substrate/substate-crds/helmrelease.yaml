---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate-crds
spec:
  interval: 1m0s
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate-crds
  ref:
    # renovate: datasource=github-releases depName=kagent-dev/substrate extractVersion=^v(?<version>.*)$
    # NOTE: chart tags are published WITHOUT the v prefix (0.0.22, not v0.0.22)
    tag: 0.0.22
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate-crds
spec:
  interval: 1m0s
  releaseName: substrate-crds
  chartRef:
    kind: OCIRepository
    name: substrate-crds
  install:
    createNamespace: true
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
              name: actortemplates.ate.dev
            patch: |-
              - op: replace
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/containers/items/properties/env/items/required
                value: ["name"]
              - op: add
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/containers/items/properties/env/items/properties/valueFrom
                value:
                  description: "Source for the environment variable value."
                  type: object
                  properties:
                    secretKeyRef:
                      description: "Selects a key of a Secret."
                      type: object
                      properties:
                        name:
                          type: string
                          maxLength: 253
                        key:
                          type: string
                          minLength: 1
                        optional:
                          type: boolean
                      required: ["name", "key"]
              - op: add
                path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/pauseImage
                value:
                  description: "Image used for the pause container."
                  type: string