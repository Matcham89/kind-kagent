# ==============================================================================
# kagent API Key Secrets — pulled from Bitwarden via External Secrets Operator
# ==============================================================================
# These ExternalSecrets reference the bitwarden-secretsmanager ClusterSecretStore
# and the Bitwarden item IDs mirror those used in the home-cluster.
#
# Before first deploy, create the Bitwarden access token:
#   kubectl create secret generic bitwarden-access-token \
#     --namespace=kube-ops \
#     --from-literal=token=$BITWARDEN_ACCESS_TOKEN
#
# The Bitwarden SDK server (bitwarden-sdk-server) is deployed by the ESO chart
# and auto-generates its own TLS certs.
# ==============================================================================
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-openai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: "00800203-a8aa-445a-ac2f-b2d4013a4986"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-anthropic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: "121df7d5-2478-4ca0-aa03-b36d00e1e52d"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-github
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
  - secretKey: GITHUB_PAT
    remoteRef:
      key: "833987cf-91fa-40ee-8bcb-b35a0141e443"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-google
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
  - secretKey: GOOGLE_API_KEY
    remoteRef:
      key: "1e03f94f-1f66-4f1a-8a7c-b42501484e56"