---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent
spec:
  interval: 1m0s
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
  ref:
    # renovate: datasource=github-releases depName=kagent-dev/kagent
    tag: 0.10.0-rc3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  interval: 1m0s
  releaseName: kagent
  chartRef:
    kind: OCIRepository
    name: kagent
  dependsOn:
    - name: kagent-crds
    - name: substrate-crds
      namespace: ate-system
  install:
    strategy:
      name: RetryOnFailure
    createNamespace: true
    timeout: 10m
  upgrade:
    strategy:
      name: RetryOnFailure
    cleanupOnFail: true
    timeout: 10m
  values:
    default: anthropic
    revisionHistoryLimit: 2

    # ==============================================================================
    # Substrate — ENABLED for AgentHarness support
    # ==============================================================================
    substrateWorkerPool:
      create: true
      replicas: 2
      ateomImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.0.21

    # ==============================================================================
    # OTel — DISABLED (no OTel collector on Kind)
    # ==============================================================================
    otel:
      tracing:
        enabled: false
        exporter:
          otlp: {}
      logging:
        enabled: false
        exporter:
          otlp: {}

    # ==============================================================================
    # Resources — relaxed for local dev
    # ==============================================================================
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 256Mi

    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000

    podSecurityContext:
      fsGroup: 1000

    controller:
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
      substrate:
        enabled: true
        ateApiEndpoint: "dns:///api.ate-system.svc:443"
        ateApiInsecure: true

    # ==============================================================================
    # Built-in agents
    # ==============================================================================
    agents:
      k8s-agent:
        enabled: true
      kgateway-agent:
        enabled: false
      istio-agent:
        enabled: false
      promql-agent:
        enabled: true
      observability-agent:
        enabled: true
      argo-rollouts-agent:
        enabled: false
      helm-agent:
        enabled: true
      cilium-policy-agent:
        enabled: false
      cilium-manager-agent:
        enabled: false
      cilium-debug-agent:
        enabled: false