# ==============================================================================
# Ollama — Local LLM
# ==============================================================================
# Points to an Ollama instance. By default looks for it in-cluster at
# ollama.<namespace>.svc.cluster.local. Change the host if your Ollama
# runs elsewhere (e.g. outside Kind on the host machine).
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ollama-gemma4
  namespace: kagent
spec:
  model: gemma4:latest
  provider: Ollama
  ollama:
    host: http://ollama.ollama.svc.cluster.local:11434