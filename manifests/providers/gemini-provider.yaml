# ==============================================================================
# Google Gemini — OpenAI-compatible API
# ==============================================================================
# Gemini has an OpenAI-compatible endpoint. Requires GOOGLE_API_KEY secret.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: gemini-flash
  namespace: kagent
spec:
  apiKeySecret: kagent-google
  apiKeySecretKey: GOOGLE_API_KEY
  model: gemini-2.5-flash
  provider: OpenAI
  openAI:
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai/
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: gemini-pro
  namespace: kagent
spec:
  apiKeySecret: kagent-google
  apiKeySecretKey: GOOGLE_API_KEY
  model: gemini-2.5-pro
  provider: OpenAI
  openAI:
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai/