# ==============================================================================
# OpenRouter — OpenAI-compatible API
# ==============================================================================
# OpenRouter provides access to many models via OpenAI-compatible API.
# Set your OpenRouter API key in the kagent-openai secret and it'll be used
# as the Authorization header. The model field uses OpenRouter model IDs.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: openrouter-deepseek-v4-flash
  namespace: kagent
spec:
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
  model: deepseek/deepseek-v4-flash-latest
  provider: OpenAI
  openAI:
    baseUrl: https://openrouter.ai/api/v1
---
