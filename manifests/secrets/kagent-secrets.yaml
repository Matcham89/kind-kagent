# ==============================================================================
# Anthropic / Claude API Key
# ==============================================================================
# Replace <YOUR_ANTHROPIC_API_KEY> with your actual Anthropic API key.
# Get one at: https://console.anthropic.com/
apiVersion: v1
kind: Secret
metadata:
  name: kagent-anthropic
  namespace: kagent
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"
---
# ==============================================================================
# OpenAI API Key
# ==============================================================================
# Replace <YOUR_OPENAI_API_KEY> with your actual OpenAI API key.
# Get one at: https://platform.openai.com/api-keys
apiVersion: v1
kind: Secret
metadata:
  name: kagent-openai
  namespace: kagent
type: Opaque
stringData:
  OPENAI_API_KEY: "<YOUR_OPENAI_API_KEY>"
---
# ==============================================================================
# Google Gemini API Key
# ==============================================================================
# Replace <YOUR_GOOGLE_API_KEY> with your actual Google AI API key.
# Get one at: https://aistudio.google.com/apikey
apiVersion: v1
kind: Secret
metadata:
  name: kagent-google
  namespace: kagent
type: Opaque
stringData:
  GOOGLE_API_KEY: "<YOUR_GOOGLE_API_KEY>"
---
# ==============================================================================
# GitHub Personal Access Token (for GitHub MCP)
# ==============================================================================
# Replace <YOUR_GITHUB_PAT> with a classic PAT with repo scope.
# Create one at: https://github.com/settings/tokens
apiVersion: v1
kind: Secret
metadata:
  name: kagent-github
  namespace: kagent
type: Opaque
stringData:
  GITHUB_PAT: "<YOUR_GITHUB_PAT>"
---
# ==============================================================================
# OpenRouter Placeholder
# ==============================================================================
# OpenRouter uses OpenAI-compatible API. If using OpenRouter, put your real
# key in the kagent-openai secret above and point the provider to OpenRouter's
# baseUrl. This placeholder is only needed because kagent's OpenAI client
# requires some non-empty Authorization value to construct requests.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-openrouter-placeholder
  namespace: kagent
type: Opaque
stringData:
  OPENROUTER_API_KEY: "not-a-real-key-set-your-openrouter-key-in-kagent-openai-instead"